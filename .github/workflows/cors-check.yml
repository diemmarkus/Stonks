name: probe
on: { push: { paths: [".github/workflows/cors-check.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          OV=https://api.onvista.de/api/v1
          for q in NVDA AAPL SNAP TSLA; do echo "== $q"; curl -s "$OV/instruments/search/facet?searchValue=$q" | jq -c '.facets[] | {f:.type, r:[.results[]? | {isin,symbol,entityType,name}]}'; done
