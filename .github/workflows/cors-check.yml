name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in AAPL "Apple" "3M" "MMM" "Alphabet" "GOOGL" "Berkshire Hathaway"; do
            printf "== %s: " "$q"; curl -s "https://api.onvista.de/api/v1/instruments/search/facet?searchValue=$(printf %s "$q" | jq -sRr @uri)" -o /tmp/b -w "%{http_code} "
            jq -c '[.facets[]? | select(.type=="STOCK") | (.results // [])[] | {isin, name, symbol, ws: .wkn}] | .[:3]' /tmp/b 2>/dev/null || head -c 200 /tmp/b; echo
          done
          printf "== keys: "; jq -c '.facets[0] | keys' /tmp/b
