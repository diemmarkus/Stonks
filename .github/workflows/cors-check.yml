name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          echo "== datasets csv"; curl -s -o /tmp/c -w "%{http_code}\n" https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv; head -3 /tmp/c; wc -l /tmp/c
          echo "== finnhub constituents"; curl -s "https://finnhub.io/api/v1/index/constituents?symbol=^GSPC&token=$K" | head -c 200; echo
          echo "== profile2"; curl -s "https://finnhub.io/api/v1/stock/profile2?symbol=AAPL&token=$K" | head -c 400; echo
          echo "== onvista AAPL"; curl -s "https://api.onvista.de/api/v1/instruments/search/facet?searchValue=AAPL" | jq -c '[.facets[] | select(.type=="STOCK") | .results[]? | {isin, name, symbol}] | .[:3]'
          echo "== onvista Apple Inc."; curl -s "https://api.onvista.de/api/v1/instruments/search/facet?searchValue=Apple%20Inc." | jq -c '[.facets[] | select(.type=="STOCK") | .results[]? | {isin, name, symbol}] | .[:3]'
