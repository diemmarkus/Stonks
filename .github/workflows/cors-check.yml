name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://raw.githubusercontent.com/datasets/nasdaq-listings/main/data/nasdaq-listed-symbols.csv https://raw.githubusercontent.com/datasets/nasdaq-listings/main/data/nasdaq-listed.csv https://raw.githubusercontent.com/datasets/nyse-other-listings/main/data/nyse-listed.csv https://raw.githubusercontent.com/datasets/nyse-other-listings/main/data/other-listed.csv; do
            curl -s -o /tmp/f -w "== %{http_code} $u\n" "$u"; head -2 /tmp/f | cut -c1-200; wc -l < /tmp/f; grep -i "^SNAP," /tmp/f | head -1
          done
