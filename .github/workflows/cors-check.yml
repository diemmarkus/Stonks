name: probe
on: { push: { paths: [".github/workflows/cors-check.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          OV=https://api.onvista.de/api/v1
          for q in XLE SPY IBIT BRK.B GOOGL SMH V; do echo "== $q"; curl -s "$OV/instruments/search/facet?searchValue=$q" | jq -c "[.facets[] | select(.type==\"STOCK\" or .type==\"FUND\" or .type==\"ETF\") | .results[]? | [.entityType,.isin,.symbol,.name]]"; done
