name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          U="https://www.ishares.com/us/products/239707/ishares-russell-1000-etf/1467271812596.ajax?fileType=csv&fileName=IWB_holdings&dataType=fund"
          curl -sL -A "Mozilla/5.0" -o /tmp/iwb "$U" -w "ishares IWB: %{http_code}\n"; sed -n 1,12p /tmp/iwb | cut -c1-160; grep -c ',"Equity",' /tmp/iwb; grep -i '"SNAP"' /tmp/iwb | cut -c1-160
          curl -sL -o /tmp/w "https://en.wikipedia.org/wiki/Russell_1000_Index" -w "wikipedia: %{http_code}\n"; grep -o '>SNAP<' /tmp/w | head -1; grep -c '<td>' /tmp/w
          printf "finnhub SNAP rec: "; curl -s "https://finnhub.io/api/v1/stock/recommendation?symbol=SNAP&token=$K" | head -c 160; echo
