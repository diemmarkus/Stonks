name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://api.onvista.de/api/v1/instruments/FUND/156424987"; N=262733170
          T=$(date -u -d '+1 day' +%Y-%m-%d); S1=$(date -u -d '-6 day' +%Y-%m-%d); SM=$(date -u -d '-1 month' +%Y-%m-%d)
          for path in "chart_history?idNotation=$N&resolution=1m&startDate=$S1&endDate=$T" \
                      "chart_history?idNotation=$N&resolution=1m&startDate=${S1}T00:00:00.000Z&endDate=${T}T00:00:00.000Z" \
                      "chart_history?idNotation=$N&resolution=15m&startDate=$SM&endDate=$T" \
                      "chart_history?idNotation=$N&resolution=1H&startDate=$SM&endDate=$T" \
                      "simple_chart_history?chartType=PRICE&idNotation=$N&interval=M1&startDate=$SM&endDate=$T&resolution=1h" \
                      "simple_chart_history?chartType=PRICE&idNotation=$N&interval=D1&startDate=$S1&endDate=$T&resolution=1m" ; do
            printf "== %s\n   " "$path"; curl -s -o /tmp/b -w "%{http_code} " "$B/$path"
            jq -c '{keys: keys, n: ((.datetimeLast // .datetimeTick // [])|length), step_min: (((.datetimeLast // .datetimeTick // [0,0]) as $t | if ($t|length)>1 then ($t[-1]-$t[-2]) else 0 end) / (if ((.datetimeLast // [1e12])[0] > 1e11) then 60000 else 60 end))}' /tmp/b 2>/dev/null || head -c 250 /tmp/b; echo
          done
