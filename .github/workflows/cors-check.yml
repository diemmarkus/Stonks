name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "funds/ISIN:LU0908500753" "derivatives/ISIN:IE00B4ND3602" "funds/ISIN:IE00BK5BQT80"; do
            echo "== $u"
            curl -s "https://api.onvista.de/api/v1/$u/snapshot" | jq -r '.quoteList.list[] | select(.isoCurrency=="EUR") | [.market.name, (.last|tostring), (.bid|tostring), (.ask|tostring), (.previousLast|tostring), (.datetimeLast // "")[11:16]] | @tsv'
          done
