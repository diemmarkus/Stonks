name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          curl -sL -A "stonks-bot/1.0 (github.com/diemmarkus/Stonks)" -o /tmp/w "https://en.wikipedia.org/w/api.php?action=parse&page=Russell_1000_Index&prop=text&format=json&formatversion=2" -w "wiki http %{http_code}\n"
          python3 - <<'PY'
          import json,re,html
          t=json.load(open('/tmp/w'))['parse']['text']
          rows=re.findall(r'<tr>(.*?)</tr>',t,re.S)
          out=[]
          for r in rows:
              cells=[re.sub(r'<.*?>','',c).strip() for c in re.findall(r'<td[^>]*>(.*?)</td>',r,re.S)]
              if len(cells)>=2: out.append(cells[:3])
          print("rows:",len(out)); print(out[:3]); print([c for c in out if 'SNAP' in c or 'Snap' in ' '.join(c)])
          PY
          printf "finnhub SNAP: "; curl -s "https://finnhub.io/api/v1/stock/recommendation?symbol=SNAP&token=$K" | head -c 160; echo
