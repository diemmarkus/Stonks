name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=$(curl -s "https://api.onvista.de/api/v1/stocks/ISIN:US0378331005/snapshot")
          echo "keys: $(echo "$S" | jq -c 'keys')"
          echo "quote: $(echo "$S" | jq -c '.quote' | head -c 700)"
          echo "paths: $(echo "$S" | jq -c '[paths(type == "number") | map(tostring) | join(".")] | map(select(test("[Nn]otation"))) | .[:15]')"
          N=$(echo "$S" | jq -r '.quote.market.idNotation // .quote.idNotation // empty')
          EV=$(echo "$S" | jq -r '.instrument.entityValue')
          echo "N=$N EV=$EV"
          for iv in D1 W1 M1 Y1 Y5 MAX; do
            u="https://api.onvista.de/api/v1/instruments/STOCK/$EV/simple_chart_history?chartType=PRICE&idNotation=$N&interval=$iv&withEarnings=false"
            printf "== %s: " $iv; curl -s -o /tmp/b -w "%{http_code} " "$u"; head -c 350 /tmp/b; echo
          done
