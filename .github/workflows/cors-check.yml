name: probe
on: { push: { paths: [".github/workflows/cors-check.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          OV=https://api.onvista.de/api/v1
          curl -s "$OV/instruments/search/facet?searchValue=NVDA" | jq -c '[.facets[].results[]? | {isin,symbol,entityType,name}] | .[:4]'
          curl -s "$OV/stocks/ISIN:US67066G1040/snapshot" > s.json
          jq -c '.quoteList.list[] | {m:.market.name, n:.market.idNotation, c:.isoCurrency, p:.last, v:.volume, t:.datetimeLast}' s.json
          jq -c '{chart:.chart.idNotation, quote:.quote.market}' s.json
          E=$(jq -r .instrument.entityValue s.json); echo "entity $E"
          for n in 277381 120478602; do for iv in "MAX&resolution=1D&startDate=1986-11-15" "Y5&resolution=1D&startDate=2021-11-15" "Y1&resolution=1D&startDate=2025-11-15"; do
            echo "== $n $iv"; curl -s "$OV/instruments/STOCK/$E/simple_chart_history?chartType=PRICE&interval=$iv&endDate=2026-11-16&withEarnings=false&idNotation=$n" | jq -c '{keys:keys, nl:(.datetimeLast|length), nt:(.datetimeTick|length), fl:.datetimeLast[0], fp:.last[0], lp:.last[-1], ll:.datetimeLast[-1], ft:.tick[0], lt:.tick[-1], mx:(.last|max), mn:(.last|min)}'
          done; done
