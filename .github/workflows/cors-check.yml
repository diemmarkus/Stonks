name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://api.onvista.de/api/v1/funds/ISIN:IE00BK5BQT80/snapshot" | jq -r '.quoteList.list[] | [.market.name, .isoCurrency, (.last|tostring), (.bid|tostring), (.ask|tostring), (.previousLast|tostring), .datetimeLast] | @tsv'
