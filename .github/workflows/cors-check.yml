name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /tmp/b -w "symbols read: HTTP %{http_code}\n" "https://firestore.googleapis.com/v1/projects/stonks-6ec1f/databases/(default)/documents/symbols?pageSize=5&key=AIzaSyAE-QjP0JxtyXLTkJsYwFyqGCMimFNjgFA"
          head -c 200 /tmp/b; echo
