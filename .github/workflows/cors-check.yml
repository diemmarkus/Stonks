name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: onvista CORS headers
        run: |
          for u in "https://api.onvista.de/api/v1/instruments/search/facet?searchValue=LU0908500753" "https://api.onvista.de/api/v1/funds/ISIN:LU0908500753/snapshot"; do
            echo "== GET $u"
            curl -s -D - -o /tmp/body -H "Origin: https://diemmarkus.github.io" "$u" | grep -i -E "^HTTP|access-control|content-type" || true
            head -c 300 /tmp/body; echo
            echo "== OPTIONS $u"
            curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://diemmarkus.github.io" -H "Access-Control-Request-Method: GET" "$u" | grep -i -E "^HTTP|access-control" || true
          done
