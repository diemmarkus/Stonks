name: probe
on: { push: { paths: [".github/workflows/cors-check.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          echo 'export { resolve };' >> js/chart.js
          cat > t.mjs <<'JS'
          import fs from "node:fs";
          const { resolve } = await import("./js/chart.js");
          const d = JSON.parse(fs.readFileSync("data/movers.json"));
          for (const q of d.quotes) {
            try { const s = await resolve(q.symbol, "USD", undefined, { name: q.name, price: q.price });
              const h = await (await fetch(`https://api.onvista.de/api/v1/instruments/${s.type}/${s.id}/simple_chart_history?chartType=PRICE&interval=Y1&resolution=1D&idNotation=${s.notation}`)).json();
              console.log("OK", q.symbol, q.price, s.type, s.id, s.notation, "last", h.tick?.at(-1) ?? h.last?.at(-1), "n", (h.tick||h.last||[]).length);
            } catch (e) { console.log("NO", q.symbol, q.name, e.message); }
          }
          JS
          node t.mjs
