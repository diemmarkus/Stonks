name: CORS check (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://api.onvista.de/api/v1/instruments/FUND/156424987"; N=262733170
          T=$(date -u -d '+1 day' +%Y-%m-%d); SW=$(date -u -d '-8 day' +%Y-%m-%d); SM=$(date -u -d '-1 month' +%Y-%m-%d); SD=$(date -u -d '-6 day' +%Y-%m-%d)
          for iv in "D1 $SD" "W1 $SW" "M1 $SM"; do set -- $iv
            for r in 1m 5m 10m 15m 30m 1h 60m 1H 2h 4h; do
              printf "%s %s: " $1 $r; curl -s -o /tmp/b -w "%{http_code} " "$B/simple_chart_history?chartType=PRICE&idNotation=$N&interval=$1&startDate=$2&endDate=$T&withEarnings=false&resolution=$r"
              jq -c '{n: (.datetimeTick|length), step: (if (.datetimeTick|length)>2 then ((.datetimeTick[2]-.datetimeTick[1])/60000) else null end)}' /tmp/b 2>/dev/null || true
            done
          done
