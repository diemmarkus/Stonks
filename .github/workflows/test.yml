name: Test
on:
  push:
    paths-ignore: ["data/**"]   # skip the price/analyst bot commits
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-package-lock playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: tests/out/ }
