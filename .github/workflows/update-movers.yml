name: Update prices

on:
  schedule:
    # Weekdays every 30 min from European open to US close (≈ 08:00–22:00 Vienna). Times are UTC.
    - cron: "*/30 7-20 * * 1-5"
    - cron: "15 21 * * 1-5"
    # Every hour otherwise (evenings, nights, weekends), so newly added ISINs get a price soon.
    # Nothing is committed when prices haven't changed.
    - cron: "5 * * * *"
  workflow_dispatch: # run by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-movers.yml"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Movers (US watchlist, Finnhub)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/update-movers.mjs
        continue-on-error: true

      - name: Crypto prices and EUR/USD
        run: node scripts/update-prices.mjs
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "stonks-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update prices"
            git pull --rebase --quiet
            git push
          fi
